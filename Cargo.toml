[workspace]
members  = ["crates/synth-tui", "crates/synthie", "crates/synthie-tracker", "crates/synthie-ui", "crates/synthie-wasm"]
resolver = "3"

[workspace.package]
version    = "0.6.0"
edition    = "2024"
authors    = ["Markus Mayer <widemeadows@gmail.com>"]
repository = "https://github.com/sunsided/synth"
license    = "EUPL-1.2"

[workspace.dependencies]
anyhow            = "1"
cpal              = "0.18"
crossbeam-channel = "0.5"
crossterm         = "0.29"
libm              = "0.2"
proptest          = "1"
ratatui           = { version = "0.30.2", default-features = false, features = ["std", "underline-color", "all-widgets", "macros", "layout-cache"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"

[workspace.lints.clippy]
pedantic = "warn"

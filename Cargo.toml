[workspace]
members  = ["crates/synth", "crates/synth-tui"]
resolver = "3"

[workspace.dependencies]
anyhow            = "1"
cpal              = "0.17"
crossbeam-channel = "0.5"
crossterm         = "0.29"
ratatui           = "0.30"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"

[workspace.lints.clippy]
pedantic = "warn"

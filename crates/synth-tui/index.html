<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Synthie</title>
    <link data-trunk rel="rust" data-bin="synth-tui" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0c0918; /* theme::BG */
        color: #ded8ff; /* theme::FG */
        overflow: hidden;
      }
      body {
        font-family: "JetBrains Mono", "Fira Code", "DejaVu Sans Mono", Menlo, Consolas,
          ui-monospace, monospace;
        font-size: 14px;
      }
      /* The WebGL2 canvas fills the viewport; the app centres the UI in it
         and re-centres as the canvas follows window resizes. */
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body></body>
</html>

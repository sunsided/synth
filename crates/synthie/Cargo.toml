[package]
name        = "synthie"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Rust synthesizer engine library with ADSR, filters, LFO, and reverb"
repository.workspace = true
license.workspace = true
readme      = "README.md"
keywords    = ["synthesizer", "audio", "midi", "gamedev", "game-audio"]
categories  = ["game-engines", "multimedia::audio"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "synthie"
path = "src/lib.rs"

[features]
## Enables `serde` support and the `cpal`-based I/O layer by default.
default = ["serde", "io"]
## Enables `serde` support.
serde   = ["dep:serde"]
## Enables the `cpal`-based audio I/O layer (`engine` module).
## Disable to get a DSP-only build suitable for embedding or `no_std` targets.
io      = ["dep:anyhow", "dep:cpal", "dep:crossbeam-channel"]

[dependencies]
anyhow            = { workspace = true, optional = true }
cpal              = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
serde             = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[[example]]
name = "tune"
path = "examples/tune.rs"
required-features = ["io"]

[[example]]
name = "lazy_jones"
path = "examples/lazy_jones.rs"
required-features = ["io"]

[[example]]
name = "kernkraft"
path = "examples/kernkraft.rs"
required-features = ["io"]

[[example]]
name = "bitcrusher"
path = "examples/bitcrusher.rs"
required-features = ["io"]

[[example]]
name = "fx_delay_chorus"
path = "examples/fx_delay_chorus.rs"
required-features = ["io"]

[[example]]
name = "osc_richness"
path = "examples/osc_richness.rs"
required-features = ["io"]

[[example]]
name = "mod_depth"
path = "examples/mod_depth.rs"
required-features = ["io"]

[lints]
workspace = true

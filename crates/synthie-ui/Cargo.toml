[package]
name              = "synthie-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "Shared neon/retro look and widgets for the synthie terminal front-ends"
repository.workspace = true
license.workspace = true
publish           = false

[features]
default   = ["crossterm"]
## `From<crossterm::event::KeyEvent>` for [`Key`].
crossterm = ["dep:crossterm"]
## `From<&web_sys::KeyboardEvent>` for [`Key`].
web       = ["dep:web-sys"]

[dependencies]
crossbeam-channel = { workspace = true }
crossterm         = { workspace = true, optional = true }
ratatui           = { workspace = true }
web-sys           = { version = "0.3", optional = true, features = ["KeyboardEvent"] }
web-time          = "1"

[lints]
workspace = true

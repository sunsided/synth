[package]
name              = "synthie-tracker"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "Step-sequencer tracker TUI for the synthie engine"
repository.workspace = true
license.workspace = true
publish           = false

[[bin]]
name = "synthie-tracker"
path = "src/main.rs"

[features]
default    = ["mod-import"]
## Import 4-channel ProTracker `.mod` files from the command line and play
## the original for A/B comparison (terminal build only). Pulls in `xmrs`.
mod-import = ["dep:xmrs", "dep:xmrsplayer"]

[dependencies]
anyhow            = { workspace = true }
cpal              = { workspace = true }
crossbeam-channel = { workspace = true }
ratatui           = { workspace = true }
synthie           = { path = "../synthie" }
synthie-ui        = { path = "../synthie-ui", default-features = false }

# Terminal build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm  = { workspace = true }
ratatui    = { workspace = true, features = ["crossterm"] }
synthie-ui = { path = "../synthie-ui", features = ["crossterm"] }
# Reference playback of loaded MOD files (original samples), for A/B testing.
xmrs       = { version = "0.15", default-features = false, features = ["std", "import_mod"], optional = true }
xmrsplayer = { version = "0.15", default-features = false, features = ["std", "import_mod"], optional = true }

# Browser build (`trunk build`): Ratzilla renders, cpal plays through WebAudio.
[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal       = { workspace = true, features = ["wasm-bindgen"] }
ratzilla   = "0.3.1"
synthie-ui = { path = "../synthie-ui", default-features = false, features = ["web"] }

[lints]
workspace = true

[package.metadata.release]
# Not published; versioned with the workspace. `synthie` cuts the release.
release = false

[package]
name              = "synthie-tracker"
version.workspace = true
edition.workspace = true
authors.workspace = true
description       = "Step-sequencer tracker TUI for the synthie engine"
repository.workspace = true
license.workspace = true
publish           = false

[[bin]]
name = "synthie-tracker"
path = "src/main.rs"

[dependencies]
anyhow            = { workspace = true }
cpal              = { workspace = true }
crossbeam-channel = { workspace = true }
ratatui           = { workspace = true }
synthie           = { path = "../synthie" }
synthie-ui        = { path = "../synthie-ui", default-features = false }

# Terminal build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm  = { workspace = true }
ratatui    = { workspace = true, features = ["crossterm"] }
synthie-ui = { path = "../synthie-ui", features = ["crossterm"] }

# Browser build (`trunk build`): Ratzilla renders, cpal plays through WebAudio.
[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal       = { workspace = true, features = ["wasm-bindgen"] }
ratzilla   = "0.3.1"
synthie-ui = { path = "../synthie-ui", default-features = false, features = ["web"] }

[lints]
workspace = true

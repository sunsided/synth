name: Lint and Test

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main
      - 'release/*'
      - 'feature/*'
  # First stage of release.yml: a tag only publishes after these checks pass.
  workflow_call:

concurrency:
  # A fixed name: when called, github.workflow would be the caller's and the
  # group would collide with release.yml's own (names compare case-insensitively).
  group: test-${{ github.ref }}
  # Superseded branch runs can go; runs called from a release must finish.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Clippy and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ALSA development libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache; other refs only restore it. Nothing in
          # this workflow publishes artifacts built from the cache.
          save-if: ${{ github.ref == 'refs/heads/main' }} # zizmor: ignore[cache-poisoning]

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Run Clippy on the wasm builds (browser apps, npm package)
        run: cargo clippy --target wasm32-unknown-unknown -p synth-tui -p synthie-tracker -p synthie-wasm -- -D warnings

      - name: Check DSP-only build (std, no io)
        run: cargo check -p synthie --no-default-features --features std

      - name: Check DSP-only build (libm, no std/io)
        run: cargo check -p synthie --no-default-features --features libm

  npm-package:
    name: npm package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain with wasm32 target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Same policy as above: only main writes the cache. The package built
          # here is only tested, never published.
          save-if: ${{ github.ref == 'refs/heads/main' }} # zizmor: ignore[cache-poisoning]

      - name: Install wasm-pack
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: wasm-pack

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build and test the npm package
        run: task test:npm

version: '3'

vars:
  # Build profile switching
  PROFILE: '{{ .PROFILE | default "debug" }}'                # accepts: debug|release
  PROFILE_FLAG: '{{ if eq .PROFILE "release" }}--release{{ end }}'
  PROFILE_DIR: '{{ if eq .PROFILE "release" }}release{{ else }}debug{{ end }}'

tasks:
  default:
    cmds:
      - cmd: task --list --sort=none
        silent: true

  sort:toml:
    preconditions:
      - sh: command -v cargo-sort
        msg: "cargo-sort not found — please install via cargo install cargo-sort"
    sources:
      - Cargo.toml
      - crates/*/Cargo.toml
    cmds:
      - cargo sort --workspace

  fmt:
    aliases:
      - format
    sources:
      - Cargo.toml
      - crates/**/*.toml
      - crates/**/*.rs
    cmds:
      - task: sort:toml
      - cargo fmt --all

  lint:
    desc: Lint the code
    cmds:
      - cargo clippy --all-targets {{.CLI_ARGS}}

  lint-fix:
    internal: true
    cmds:
      - task: lint:fix
        vars:
          CLI_ARGS: '{{.CLI_ARGS}}'

  lint:fix:
    desc: Lint the code and apply fixes
    aliases:
      - fix
    cmds:
      - cargo clippy --all-targets --fix --allow-staged {{.CLI_ARGS}}
      - task: fmt

  check:
    desc: Run all checks — format, lint, compile, and fuzz target build (fuzz skipped if cargo-fuzz/nightly absent)
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --all-targets -- -D warnings
      - cargo check
      - cmd: |
          if command -v cargo-fuzz >/dev/null 2>&1 && rustup toolchain list 2>/dev/null | grep -q nightly; then
            task fuzz:build
          else
            echo "note: skipping fuzz:build — cargo-fuzz or nightly toolchain not found"
            echo "      install with: cargo install cargo-fuzz && rustup toolchain install nightly"
          fi

  gc:
    desc: Clean up outdated build artifacts
    preconditions:
      - sh: command -v cargo-gc
        msg: "cargo-gc not found — please install via cargo install cargo-gc-bin"
    cmds:
      - cargo gc

  sweep:
    desc: Clean outdated build artifacts by timestamp (see also gc)
    preconditions:
      - sh: command -v cargo-sweep
        msg: "cargo-sweep not found — please install via cargo install cargo-sweep"
    cmds:
      - cargo sweep --installed

  clean:
    desc: Clean all build artifacts (use sweep for a lightweight clean)
    status:
      - test ! -d target
    cmds:
      - cargo clean

  build:
    desc: Build the application
    sources:
      - Cargo.toml
      - Cargo.lock
      - crates/**/*.rs
      - crates/**/*.toml
    generates:
      - target/{{.PROFILE_DIR}}/synth-tui
    requires:
      vars:
        - name: PROFILE
          enum:
            - debug
            - release
    cmds:
      - cargo build -p synth-tui {{.PROFILE_FLAG}}

  build:timing:
    desc: Build with timings (nightly)
    requires:
      vars:
        - name: PROFILE
          enum:
            - debug
            - release
    cmds:
      - cargo +nightly build --workspace --timings=html,json -Zunstable-options {{.PROFILE_FLAG}}

  test:
    desc: Run all tests
    env:
      RUST_LOG: disabled
    cmds:
      - cargo test {{.CLI_ARGS}}

  test:docs:
    desc: Run doctests only
    env:
      RUST_LOG: disabled
    cmds:
      - cargo test --doc {{.CLI_ARGS}}

  upgrade:deps:
    desc: Upgrade the dependencies
    cmds:
      - cargo upgrade
      - cargo update

  run:
    desc: Run the application
    cmds:
      - cargo run -p synth-tui {{.PROFILE_FLAG}} -- {{.CLI_ARGS}}

  example:tune:
    desc: Run the tune example (chord progression + melody, SID-style)
    aliases:
      - tune
    cmds:
      - cargo run -p synthie {{.PROFILE_FLAG}} --example tune -- {{.CLI_ARGS}}

  example:lazy-jones:
    desc: Run the Lazy Jones example (B minor hook, 140 BPM, two-channel)
    aliases:
      - lazy
      - example
    cmds:
      - cargo run -p synthie {{.PROFILE_FLAG}} --example lazy_jones -- {{.CLI_ARGS}}

  example:kernkraft:
    desc: Run the Kernkraft 400 / Zombie Nation example (Bb minor, full song structure)
    aliases:
      - kernkraft
    cmds:
      - cargo run -p synthie {{.PROFILE_FLAG}} --example kernkraft -- {{.CLI_ARGS}}

  example:bitcrusher:
    desc: Run the bitcrusher FX demo (A4 sawtooth cycling through bit depth and decimation settings)
    aliases:
      - bitcrusher
    cmds:
      - cargo run -p synthie {{.PROFILE_FLAG}} --example bitcrusher -- {{.CLI_ARGS}}

  example:fx-delay-chorus:
    desc: Run the delay/chorus FX demo (A4 sawtooth cycling through delay time, feedback, and chorus settings)
    aliases:
      - fx-delay-chorus
    cmds:
      - cargo run -p synthie {{.PROFILE_FLAG}} --example fx_delay_chorus -- {{.CLI_ARGS}}

  example:osc-richness:
    desc: Run the oscillator richness demo (sine, dual-OSC unison, and hard sync across a C major arpeggio)
    aliases:
      - osc-richness
    cmds:
      - cargo run -p synthie {{.PROFILE_FLAG}} --example osc_richness -- {{.CLI_ARGS}}

  example:mod-depth:
    desc: Run the modulation depth demo (filter env, pitch env, four LFO shapes, dual-LFO across an A minor phrase)
    aliases:
      - mod-depth
    cmds:
      - cargo run -p synthie {{.PROFILE_FLAG}} --example mod_depth -- {{.CLI_ARGS}}

  example:ring-mod:
    desc: Run the ring modulation demo (Off, SID, Rev, Analog across a C major arpeggio with sine+sine OSC2 at a fifth)
    aliases:
      - ring-mod
    cmds:
      - cargo run -p synthie {{.PROFILE_FLAG}} --example ring_mod -- {{.CLI_ARGS}}

  example:arp:
    desc: "Run the arpeggiator demo (four modes: Up, Down, UpDown, Random across an A-minor progression)"
    aliases:
      - arp
    cmds:
      - cargo run -p synthie {{.PROFILE_FLAG}} --example arp -- {{.CLI_ARGS}}

  fuzz:build:
    desc: Build all fuzz targets (compile check only, no execution)
    preconditions:
      - sh: command -v cargo-fuzz
        msg: "cargo-fuzz not found — please install via cargo install cargo-fuzz"
      - sh: rustup toolchain list | grep -q nightly
        msg: "nightly toolchain not found — please install via rustup toolchain install nightly"
    cmds:
      - cargo +nightly fuzz build --fuzz-dir crates/synthie/fuzz

  fuzz:targets:
    desc: List all fuzzing targets
    preconditions:
      - sh: command -v cargo-fuzz
        msg: "cargo-fuzz not found — please install via cargo install cargo-fuzz"
      - sh: rustup toolchain list | grep -q nightly
        msg: "nightly toolchain not found — please install via rustup toolchain install nightly"
    cmds:
      - cargo fuzz list --fuzz-dir crates/synthie/fuzz

  fuzz:
    desc: Run fuzzing on the specified target
    preconditions:
      - sh: command -v cargo-fuzz
        msg: "cargo-fuzz not found — please install via cargo install cargo-fuzz"
      - sh: rustup toolchain list | grep -q nightly
        msg: "nightly toolchain not found — please install via rustup toolchain install nightly"
    vars:
      TARGET: { sh: 'echo {{.CLI_ARGS}}' }
    env:
      RUSTFLAGS: -Z sanitizer=address
    cmds:
      - cargo +nightly fuzz run --fuzz-dir crates/synthie/fuzz {{.TARGET}}

  docs:
    desc: Build the documentation; use docs:open to also open it
    sources:
      - crates/**/*.toml
      - crates/**/*.rs
    generates:
      - target/doc/**
    cmds:
      - rm -rf target/doc
      - cargo doc --workspace --document-private-items --no-deps {{.CLI_ARGS}}

  docs:open:
    desc: Build and open the docs
    aliases:
      - open:docs
    cmds:
      - task: docs
        vars:
          CLI_ARGS: --open {{.CLI_ARGS}}

  crev:verify:
    desc: Verify the current project against crev
    cmds:
      - cargo crev verify {{.CLI_ARGS | default "--show-all"}}

  crev:update:
    desc: Update crev public proofs
    cmds:
      - cargo crev repo fetch all
